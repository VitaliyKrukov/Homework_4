name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgresql:  # Добавляем PostgreSQL для тестов
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        SECRET_KEY: test-key-123-for-ci-cd
        DEBUG: True
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        SECRET_KEY: test-key-123-for-ci-cd
        DEBUG: True
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ALLOWED_HOSTS: localhost,testserver
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e  # Останавливать выполнение при ошибках
          
          cd ~/education-platform
          
          # Обновляем код
          git fetch origin
          git reset --hard origin/main
          
          # Активируем виртуальное окружение
          source venv/bin/activate
          
          # Обновляем зависимости
          pip install -r requirements.txt
          
          # Применяем миграции
          python manage.py migrate
          
          # Собираем статику
          python manage.py collectstatic --noinput --clear
          
          # Перезапускаем приложение
          sudo systemctl restart education-platform
          
          # Проверяем статус
          sudo systemctl status education-platform --no-pager
          
          echo "✅ Деплой успешно завершен!"